const CATS={hub:{label:'Hubs / basecamps',color:'#9085e9',on:true},shot:{label:'✓ Shot',color:'#0ca30c',on:true},secured:{label:'✓ Secured',color:'#0ca30c',on:true},legacy:{label:'Pilot legacy',color:'#3987e5',on:true},hellhouse:{label:'Hell House candidates',color:'#d03b3b',on:true},option:{label:'Other set options',color:'#fab219',on:true},dead:{label:'Burned original',color:'#666663',on:true}};
const map=L.map('map',{scrollWheelZoom:true,maxZoom:18});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(map);
LOCS.filter(l=>l.c==='hub').forEach(h=>L.circle([h.lat,h.lng],{radius:40000,color:'#9085e9',weight:1.2,dashArray:'6 7',fill:true,fillColor:'#9085e9',fillOpacity:0.04,interactive:false}).addTo(map));
function popup(l){const chip={shot:'✓ SHOT',secured:'✓ SECURED',legacy:'PILOT SET',hellhouse:'HELL HOUSE CANDIDATE',option:'OPTION',hub:'BASECAMP',dead:'BURNED'}[l.c]||'';let h=`<b class="pn">${l.n}</b><span class="pr">${l.r}</span>`;if(l.no)h+=`<div class="pc">${l.no}</div>`;h+=`<div class="pc" style="margin-top:6px"><span style="color:${CATS[l.c].color};font-weight:700">${chip}</span>${l.u?` · <a href="${l.u}" target="_blank" rel="noopener">open ↗</a>`:''}</div>`;return h;}
const markers=[];
LOCS.forEach(l=>{let m;if(l.c==='hub'){m=L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:'<div class=hubicon>🏕️</div>',iconSize:[20,20],iconAnchor:[10,10]})});}else{m=L.circleMarker([l.lat,l.lng],{radius:l.c==='hellhouse'?8:7,color:CATS[l.c].color,weight:2,fillColor:CATS[l.c].color,fillOpacity:l.c==='option'?0.45:0.72});}m.bindPopup(popup(l),{maxWidth:290});m.bindTooltip(l.n,{direction:'top',offset:[0,-8]});m._cat=l.c;m.addTo(map);markers.push(m);});
map.fitBounds(L.latLngBounds(LOCS.map(l=>[l.lat,l.lng])).pad(0.05));
const ff=document.getElementById('filters');
Object.entries(CATS).forEach(([k,c])=>{const lab=document.createElement('label');lab.innerHTML=`<input type=checkbox ${c.on?'checked':''} data-cat="${k}"><i style="background:${c.color}"></i>${c.label}`;ff.appendChild(lab);});
ff.addEventListener('change',e=>{const cat=e.target.dataset.cat;if(!cat)return;markers.filter(m=>m._cat===cat).forEach(m=>e.target.checked?m.addTo(map):map.removeLayer(m));});
